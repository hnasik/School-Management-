<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Archive & Data Manager | School Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- SheetJS for Excel/CSV Import & Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #9c27b0;
      --primary-dark: #6a1b9a;
      --bg-main: #f3f4f6;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
    }

    /* ================= SIDEBAR ================= */
    .sidebar {
      width: 260px; background: linear-gradient(180deg, #4a148c, #7b1fa2, #9c27b0);
      color: #ecf0f1; padding: 2rem 1rem; box-shadow: 3px 0 15px rgba(0, 0, 0, 0.2);
      flex-shrink: 0; overflow-y: auto; height: 100vh; position: sticky; top: 0;
    }
    .sidebar h2 { margin-bottom: 2rem; font-size: 1.5rem; text-align: center; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .sidebar h2 i { font-size: 1.8rem; color: #e1bee7; }
    .nav-link { display: flex; align-items: center; padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; font-size: 0.95rem; text-decoration: none; color: #ecf0f1; transition: all 0.3s ease; gap: 12px; }
    .nav-link i { width: 20px; text-align: center; }
    .nav-link.active, .nav-link:hover { background: rgba(255, 255, 255, 0.15); transform: translateX(5px); }
    .nav-link.active { background: rgba(255, 255, 255, 0.25); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); font-weight: 600; }
    .logout-btn { margin-top: 2rem; background: #d32f2f; text-align: center; }
    .logout-btn:hover { background: #b71c1c; }

    /* ================= MAIN AREA ================= */
    .main { flex: 1; padding: 2rem; overflow-y: auto; min-width: 0; }
    
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.95); padding: 1.2rem 2rem;
      border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 2rem;
    }
    .topbar h1 { font-size: 1.6rem; color: var(--primary-dark); display: flex; align-items: center; gap: 12px; }
    
    /* ================= CARDS & PANELS ================= */
    .card {
      background: rgba(255, 255, 255, 0.95); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.5rem 2rem; margin-bottom: 1.5rem;
    }
    .card-title { font-size: 1.2rem; font-weight: 600; color: var(--primary-dark); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }

    /* ================= CONTROLS & FILTERS ================= */
    .controls-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--primary-dark); }
    .form-group select, .form-group input {
      padding: 0.7rem 1rem; border-radius: 8px; border: 1px solid #ccc;
      font-size: 0.95rem; outline: none; background: #fff; transition: 0.2s;
    }
    .form-group select:focus, .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(156, 39, 176, 0.2); }

    /* Action Buttons */
    .btn {
      padding: 0.7rem 1.2rem; border-radius: 8px; border: none; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 0.9rem; transition: 0.2s; text-decoration: none;
    }
    .btn-primary { background: linear-gradient(135deg, #9c27b0, #6a1b9a); color: white; box-shadow: 0 4px 10px rgba(156,39,176,0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(156,39,176,0.4); }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-warning:hover { background: #d97706; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-outline:hover { background: var(--primary); color: white; }

    /* ================= GROUPED ACCORDION LIST ================= */
    .archive-summary-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
      margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);
    }
    .archive-summary-header .title { font-size: 1.2rem; font-weight: 600; color: var(--primary-dark); display: flex; align-items: center; gap: 8px; }
    
    .year-filter-box { display: flex; align-items: center; gap: 10px; }
    .year-filter-box select {
      padding: 0.6rem 1rem; border-radius: 8px; border: 2px solid var(--primary);
      font-weight: 600; color: var(--primary-dark); outline: none; cursor: pointer;
    }

    .class-group {
      margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .class-group summary {
      padding: 1rem 1.5rem; background: #f8f4ff; font-weight: 600; color: var(--primary-dark);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      list-style: none; user-select: none; transition: 0.2s;
    }
    .class-group summary:hover { background: #f1ebff; }
    .class-group summary::-webkit-details-marker { display: none; }
    .class-group summary::after {
      content: '\f078'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      font-size: 0.9rem; color: var(--primary); transition: 0.3s;
    }
    .class-group[open] summary::after { transform: rotate(180deg); }
    
    .class-group summary .count-badge {
      background: var(--primary); color: white; padding: 0.2rem 0.6rem;
      border-radius: 50px; font-size: 0.8rem; margin-left: 10px;
    }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.8rem 1.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #fff; color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    tbody tr:hover { background: #fdfaff; }
    
    .badge { padding: 0.3rem 0.7rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
    .badge-archived { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2><i class="fas fa-graduation-cap"></i> School Panel</h2>
    <a href="index.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="student.html" class="nav-link"><i class="fas fa-user-graduate"></i> Students</a>
  
  
    
    
    <a href="upgrade class.html" class="nav-link"><i class="fas fa-level-up-alt"></i> Bulk Promote</a>
    
    <a href="student-archive.html" class="nav-link active"><i class="fas fa-box-archive"></i> Archive & Backup</a>
    
    <div class="nav-link logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="topbar">
      <h1><i class="fas fa-box-archive"></i> Archive & Data Management</h1>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-success" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Export Backup</button>
        <label class="btn btn-warning" style="margin:0; cursor:pointer;">
          <i class="fas fa-upload"></i> Import Backup
          <input type="file" id="importFile" accept=".xlsx, .xls, .csv" style="display:none;" onchange="importFromExcel(event)">
        </label>
      </div>
    </div>

    <!-- ARCHIVE CONTROLS -->
    <div class="card">
      <h3 class="card-title"><i class="fas fa-cogs"></i> Archive Old Academic Year</h3>
      <p style="font-size:0.9rem; color:#666; margin-bottom:1rem;">Select an academic year and class to move its students to the archive. They will no longer appear in the active student list.</p>
      
      <div class="controls-grid">
        <div class="form-group">
          <label>Select Academic Year to Archive</label>
          <select id="archiveYear"></select>
        </div>
        <div class="form-group">
          <label>Select Class (Optional)</label>
          <select id="archiveClass">
            <option value="">All Classes</option>
            <option value="PREPRIMARY">PREPRIMARY</option>
            <option value="NURSERY">NURSERY</option>
            <option value="LKG">LKG</option>
            <option value="UKG">UKG</option>
            <option value="1">Class 1</option>
            <option value="2">Class 2</option>
            <option value="3">Class 3</option>
            <option value="4">Class 4</option>
            <option value="5">Class 5</option>
            <option value="6">Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
          </select>
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <button class="btn btn-danger" onclick="archiveStudents()"><i class="fas fa-archive"></i> Move to Archive</button>
        </div>
      </div>
    </div>

    <!-- ARCHIVED STUDENTS LIST (GROUPED & FILTERED) -->
    <div class="card">
      <div class="archive-summary-header">
        <div class="title"><i class="fas fa-list"></i> Archived Students Record</div>
        
        <div class="year-filter-box">
          <label style="font-weight:600; color:#555;">Filter by Year:</label>
          <select id="viewArchiveYear" onchange="renderArchiveList()"></select>
          <span style="font-size:0.9rem; font-weight:600; color:var(--primary); margin-left:10px;">
            Total: <span id="totalArchived">0</span>
          </span>
        </div>
      </div>
      
      <div id="groupedArchiveContainer">
        <!-- Accordion groups injected via JS -->
      </div>
    </div>
  </main>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // --- Firebase Config ---
  const firebaseConfig = {
    apiKey: "AIzaSyCOzfdIXBeh6drFhml4pOFEvPG8xV_Wjzw",
    authDomain: "school-management-projec-9db7a.firebaseapp.com",
    projectId: "school-management-projec-9db7a",
    storageBucket: "school-management-projec-9db7a.firebasestorage.app",
    messagingSenderId: "975842483778",
    appId: "1:975842483778:web:d1708792ff56014f3317db"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // --- State ---
  let currentUser = null;
  let allStudentsData = []; 
  let archivedStudents = [];

  // --- Auth ---
  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    currentUser = user;
    populateYearDropdowns();
    loadAllStudentsAndPopulateYears();
  });

  // --- Helpers (Copied from print.js) ---
  function pick(obj, ...keys) {
    if (!obj || typeof obj !== "object") return "";
    for (const k of keys) {
      const v = obj[k];
      if (v !== undefined && v !== null && v !== "") return v;
    }
    const lowerMap = {};
    for (const k of Object.keys(obj)) lowerMap[k.toLowerCase()] = k;
    for (const k of keys) {
      const actual = lowerMap[String(k).toLowerCase()];
      if (actual) {
        const v = obj[actual];
        if (v !== undefined && v !== null && v !== "") return v;
      }
    }
    return "";
  }

  function fmtDate(val) {
    if (!val) return "";
    try {
      if (typeof val === "object") {
        if (typeof val.toDate === "function") {
          const dt = val.toDate();
          if (!isNaN(dt)) return dt.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
        }
        if (typeof val.seconds === "number") {
          return new Date(val.seconds * 1000).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
        }
      }
      if (typeof val === "string") {
        const dt = new Date(val);
        if (!isNaN(dt) && val.length >= 8) {
          return dt.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
        }
      }
      if (typeof val === "number") {
        return new Date(val).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
      }
    } catch (e) {}
    return String(val);
  }

  function getClass(s) {
    return pick(s, "studentClass", "student_class", "className", "class_name", "class", "Class", "grade");
  }
  function getYear(s) {
    return pick(s, "academicYear", "academic_year", "session", "sessionYear", "session_year", "year", "academicSession", "academic_session");
  }
  
  function escapeHtml(str) {
    if (str === undefined || str === null) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  async function getSchoolBranding(uid) {
    let schoolName = "ABC PUBLIC SCHOOL";
    let schoolAddress = "";
    let logo = "";
    let sign = "";
    try {
      const snap = await db.collection("school_settings").doc(uid).get();
      if (snap.exists) {
        const d = snap.data();
        schoolName = d.schoolName || schoolName;
        schoolAddress = d.schoolAddress || "";
        logo = d.logo || "";
        sign = d.principalSignature || "";
      }
    } catch (e) {
      console.warn("school_settings fetch failed:", e);
    }
    if (!logo) logo = localStorage.getItem(`${uid}_schoolLogo`) || "";
    if (!sign) sign = localStorage.getItem(`${uid}_principalSign`) || "";
    return { schoolName, schoolAddress, logo, sign };
  }

  // --- 0. Populate Dropdowns (2026 - 2040) ---
  function populateYearDropdowns() {
    const startYear = 2026;
    const endYear = 2040;
    const currentYear = new Date().getFullYear();

    const actionYearSelect = document.getElementById('archiveYear');
    const viewYearSelect = document.getElementById('viewArchiveYear');

    const savedActionVal = actionYearSelect.value;
    const savedViewVal = viewYearSelect.value;

    actionYearSelect.innerHTML = '<option value="">-- Choose Year --</option>';
    viewYearSelect.innerHTML = '';

    for (let y = startYear; y <= endYear; y++) {
      const val = String(y);
      
      const optAction = document.createElement('option');
      optAction.value = val;
      optAction.textContent = val;
      if (savedActionVal && savedActionVal === val) optAction.selected = true;
      else if (!savedActionVal && y === currentYear) optAction.selected = true;
      actionYearSelect.appendChild(optAction);

      const optView = document.createElement('option');
      optView.value = val;
      optView.textContent = val;
      if (savedViewVal && savedViewVal === val) optView.selected = true;
      else if (!savedViewVal && y === currentYear) optView.selected = true;
      viewYearSelect.appendChild(optView);
    }
  }

  // --- 1. Load ALL students once ---
  async function loadAllStudentsAndPopulateYears() {
    const container = document.getElementById('groupedArchiveContainer');
    container.innerHTML = '<div style="text-align:center; padding: 2rem;"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i><p style="margin-top:10px; color:#666;">Syncing database...</p></div>';

    try {
      const snapshot = await db.collection('students').where('ownerId', '==', currentUser.uid).get();
      allStudentsData = [];
      archivedStudents = [];
      
      snapshot.forEach(doc => {
        const data = doc.data();
        const stuObj = { id: doc.id, ...data };
        allStudentsData.push(stuObj);
        if (data.isArchived === true) {
          archivedStudents.push(stuObj);
        }
      });

      renderArchiveList();

    } catch (err) {
      console.error("Sync error:", err);
      container.innerHTML = `<div style="text-align:center; padding: 2rem; color:red;">Error: ${err.message}</div>`;
    }
  }

  // --- 2. Render Grouped List ---
  function renderArchiveList() {
    const container = document.getElementById('groupedArchiveContainer');
    const selectedYear = document.getElementById('viewArchiveYear').value;
    
    if (!selectedYear) {
      container.innerHTML = '<div style="text-align:center; padding: 2rem; color:#666;">Please select a year to view records.</div>';
      document.getElementById('totalArchived').innerText = "0";
      return;
    }

    const filteredStudents = archivedStudents.filter(stu => {
      const y = String(stu.academicYear || stu.year || "").trim();
      return y === selectedYear;
    });

    document.getElementById('totalArchived').innerText = filteredStudents.length;

    if (filteredStudents.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding: 2rem; color:#666;"><i class="fas fa-box-open fa-2x" style="color:#ccc; margin-bottom:10px;"></i><br>No archived students found for the year ' + selectedYear + '.</div>';
      return;
    }

    const grouped = {};
    filteredStudents.forEach(stu => {
      let cls = stu.studentClass || stu.class || 'Unknown Class';
      cls = String(cls).toUpperCase();
      if (!grouped[cls]) grouped[cls] = [];
      grouped[cls].push(stu);
    });

    const sortedClasses = Object.keys(grouped).sort((a, b) => {
      if (a === 'PREPRIMARY') return -1;
      if (b === 'PREPRIMARY') return 1;
      if (a === 'NURSERY') return -1;
      if (b === 'NURSERY') return 1;
      if (a === 'LKG') return -1;
      if (b === 'LKG') return 1;
      if (a === 'UKG') return -1;
      if (b === 'UKG') return 1;
      return a.localeCompare(b, undefined, { numeric: true });
    });

    let html = '';
    sortedClasses.forEach(cls => {
      const students = grouped[cls];
      let rows = '';
      students.forEach((stu, index) => {
        rows += `
          <tr>
            <td>${index + 1}</td>
            <td style="font-weight:600; color:var(--primary-dark);">${stu.name || '-'}</td>
            <td>${stu.roll || '-'}</td>
            <td>${stu.academicYear || stu.year || '-'}</td>
            <td>
              <button class="btn btn-outline" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="printStudentDetails('${stu.id}')" title="Print Details">
                <i class="fas fa-print"></i> Print
              </button>
              <button class="btn btn-success" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="restoreStudent('${stu.id}')" title="Restore to Active">
                <i class="fas fa-undo"></i> Restore
              </button>
            </td>
          </tr>
        `;
      });

      html += `
        <details class="class-group">
          <summary>
            <div>Class: <span style="color:var(--primary);">${cls}</span> <span class="count-badge">${students.length}</span></div>
          </summary>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Student Name</th>
                  <th>Roll</th>
                  <th>Year</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </details>
      `;
    });
    container.innerHTML = html;
  }

  // --- 3. Archive Students ---
  async function archiveStudents() {
    const year = document.getElementById('archiveYear').value;
    const cls = document.getElementById('archiveClass').value;
    if (!year) return alert("Please select an Academic Year to archive.");

    const confirmMsg = cls 
      ? `Are you sure you want to archive all students of Class ${cls} for the year ${year}?` 
      : `Are you sure you want to archive ALL students for the year ${year}?`;
    if (!confirm(confirmMsg)) return;

    try {
      const batch = db.batch();
      let count = 0;

      allStudentsData.forEach(stu => {
        const stuYear = String(stu.academicYear || stu.year || stu.session || "").trim();
        const targetYear = String(year).trim();
        const matchYear = stuYear === targetYear;

        const stuClass = String(stu.studentClass || stu.class || stu.className || "").trim().toLowerCase();
        const targetClass = String(cls).trim().toLowerCase();
        
        let matchClass = true;
        if (targetClass !== "") {
            matchClass = stuClass === targetClass || stuClass === "class " + targetClass || stuClass.includes(targetClass);
        }

        const notArchived = stu.isArchived !== true;

        if (matchYear && matchClass && notArchived) {
          const ref = db.collection('students').doc(stu.id);
          batch.update(ref, { 
            isArchived: true, 
            archivedAt: firebase.firestore.FieldValue.serverTimestamp() 
          });
          count++;
        }
      });

      if (count > 0) {
        await batch.commit();
        alert(`✅ Successfully archived ${count} students.`);
        loadAllStudentsAndPopulateYears();
      } else {
        alert(`No matching active students found to archive.`);
      }
    } catch (err) {
      alert("Failed to archive: " + err.message);
    }
  }

  // --- 4. Restore Student ---
  async function restoreStudent(id) {
    if (!confirm("Restore this student back to the active student list?")) return;
    try {
      await db.collection('students').doc(id).update({ 
        isArchived: false,
        archivedAt: null
      });
      loadAllStudentsAndPopulateYears();
      alert("Student restored successfully.");
    } catch (err) {
      alert("Failed to restore: " + err.message);
    }
  }

  // --- 5. Print Student Details (Using Premium Print Template) ---
  async function printStudentDetails(id) {
    const s = allStudentsData.find(stu => stu.id === id);
    if (!s) return;

    // Fetch Branding
    const { schoolName, schoolAddress, logo, sign } = await getSchoolBranding(currentUser.uid);

    // QR Data
    const qrData = `
${schoolName}
Name: ${s.name}
Class: ${getClass(s)}
Roll: ${s.roll}
Mobile: ${s.mobile || "-"}
Session: ${getYear(s)}
`.trim();
    const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=" + encodeURIComponent(qrData);

    // Open New Window
    const w = window.open("", "_blank");

    // Resolve fields
    const vName        = pick(s, "name", "Name", "fullName", "full_name", "studentName", "student_name");

  // --- 6. Export to Excel/CSV (Backup) ---
  function exportToExcel() {
    const selectedYear = document.getElementById('viewArchiveYear').value;
    if (!selectedYear) return alert("Please select a year to export.");
    
    const toExport = archivedStudents.filter(s => {
      const y = String(s.academicYear || s.year || "").trim();
      return y === selectedYear;
    });

    if (toExport.length === 0) return alert("No archived data to export for the selected year.");

    const ws = XLSX.utils.json_to_sheet(toExport);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `Archived_${selectedYear}`);

    const fileName = `School_Backup_${selectedYear}_${new Date().toISOString().split('T')[0]}.xlsx`;
    XLSX.writeFile(wb, fileName);
  }

  // --- 7. Import from Excel/CSV ---
  function importFromExcel(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet);

        if (rows.length === 0) return alert("The uploaded file is empty.");
        if (!confirm(`Found ${rows.length} rows. Do you want to import and ARCHIVE these students?`)) return;

        const batch = db.batch();
        const collRef = db.collection('students');

        rows.forEach(row => {
          row.ownerId = currentUser.uid;
          row.isArchived = true;
          row.archivedAt = firebase.firestore.FieldValue.serverTimestamp();
          
          const newDocRef = collRef.doc();
          batch.set(newDocRef, row);
        });

        await batch.commit();
        alert(`✅ Successfully imported and archived ${rows.length} students.`);
        loadAllStudentsAndPopulateYears();
        document.getElementById('importFile').value = '';
      } catch (err) {
        alert("Failed to import: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }
