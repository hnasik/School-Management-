<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Generator Pro</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- html2canvas Library for JPG Download -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

            apiKey: "AIzaSyCOzfdIXBeh6drFhml4pOFEvPG8xV_Wjzw",
            authDomain: "school-management-projec-9db7a.firebaseapp.com",
            projectId: "school-management-projec-9db7a",
            storageBucket: "school-management-projec-9db7a.firebasestorage.app",
            messagingSenderId: "975842483778",
            appId: "1:975842483778:web:d1708792ff56014f3317db",

    <!-- CSS STYLES -->
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        /* Header */
        header {
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 2rem;
        }
        header h1 { font-size: 1.8rem; color: var(--primary-color); }
        header p { color: var(--text-light); font-size: 0.95rem; }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        /* Panels */
        .panel {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .panel-title {
            font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--bg-color); padding-bottom: 0.5rem;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Form Elements */
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--text-main); }
        
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border-color);
            border-radius: 8px; font-family: inherit; transition: border-color 0.2s;
        }
        
        textarea {
            resize: vertical; /* Allow user to resize height only */
            min-height: 80px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        /* File Upload */
        .file-upload-wrapper { position: relative; margin-bottom: 1rem; }
        .file-upload-label {
            display: block; padding: 1rem; border: 2px dashed var(--border-color);
            border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.2s;
            color: var(--text-light); font-size: 0.9rem;
        }
        .file-upload-label:hover { border-color: var(--primary-color); background-color: #f5f7ff; color: var(--primary-color); }
        input[type="file"] { display: none; }

        /* Buttons */
        .btn {
            display: inline-block; width: 100%; padding: 0.8rem 1.5rem;
            background-color: var(--primary-color); color: white; border: none;
            border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: background 0.2s; margin-top: 1rem;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #10b981; margin-top: 0; }
        .btn-secondary:hover { background-color: #059669; }
        
        /* Template Selector */
        .template-selector {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem;
        }
        .template-option {
            border: 2px solid var(--border-color); border-radius: 8px; padding: 10px;
            cursor: pointer; text-align: center; font-size: 0.8rem; transition: all 0.2s;
            background: #fff;
        }
        .template-option:hover { border-color: #a5b4fc; }
        .template-option.active { border-color: var(--primary-color); background-color: #eef2ff; color: var(--primary-color); font-weight: 600; }

        /* --- CARD PREVIEW STYLES --- */
        .card-preview-container {
            display: flex; justify-content: center; align-items: center;
            background: #e5e7eb; padding: 2rem; border-radius: var(--radius);
            min-height: 400px; overflow: hidden;
        }

        /* Base Card */
        .id-card {
            width: 350px; height: 550px; border-radius: 16px; position: relative;
            overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background: white; display: flex; flex-direction: column; text-align: left;
            transition: all 0.3s ease;
        }

        /* Typography within Card */
        .id-card h2 { margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .id-card h3 { margin: 5px 0; font-size: 14px; color: #555; font-weight: 500; }
        .id-card p { margin: 2px 0; font-size: 12px; color: #444; }
        .id-card .label { font-weight: 700; font-size: 10px; color: #888; text-transform: uppercase; display: block; margin-bottom: 2px; }
        
        .student-photo { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 3px solid white; background: #eee; }
        .sign-area { height: 50px; width: 80px; object-fit: contain; }

        /* DESIGN 1: Classic Blue */
        .design-classic { border: 2px solid #ddd; }
        .design-classic .header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: red; padding: 30px; text-align: center; }
        .design-classic .header h2 { color: white; font-size: 22px; }
        .design-classic .body { padding: 5px; flex: 1; display: flex; flex-direction: column; align-items: center; }
        .design-classic .info-row { width: 100%; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .design-classic .photo-container { margin-top: -30px; }
        .design-classic .footer { background: #f9fafb; padding: 3px 6px; display: flex; justify-content: space-between; align-items: center; }
       

        /* DESIGN 2: Creative */
        .design-creative { border: none; }
        .design-creative .bg-shape { position: absolute; top: 0; right: 0; width: 150px; height: 150px; background: linear-gradient(45deg, #ec4899, #8b5cf6); border-bottom-left-radius: 100%; z-index: 1; }
        .design-creative .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; }
        .design-creative .top { padding: 20px; }
        .design-creative .main { flex: 1; padding: 0 20px; display: flex; flex-direction: column; justify-content: center; }
        .design-creative .student-photo { width: 120px; height: 120px; border-radius: 12px; border: none; }
        .design-creative .info-grid { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .design-creative .footer { background: #8b5cf6; color: white; padding: 15px; text-align: center; font-size: 10px; letter-spacing: 2px;margin-top: auto; }

        /* DESIGN 3: Modern Badge */
        .design-badge { background: #fff; display: flex; flex-direction: row; }
        .design-badge .sidebar {
            width: 30%; 
            background: linear-gradient(180deg, #0f172a 0%, #334155 100%);
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 10px;
            justify-content: center;
        }
        .design-badge .sidebar h3 { 
            transform: rotate(-90deg); 
            color: rgba(255,255,255,0.3); 
            font-size: 12px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            white-space: nowrap; 
            margin-top: 100px;
        }
        .design-badge .sidebar .logo-box {
            width: 40px; height: 40px; background: #38bdf8; border-radius: 50%; margin-bottom: 20px;
        }
        .design-badge .main-content {
            width: 70%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .design-badge .header-badge {
            margin-bottom: 30px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .design-badge .info-list {
            display: flex; flex-direction: column; gap: 15px;
        }
        .design-badge .info-item {
            display: flex; flex-direction: column;
        }
        .design-badge .info-item strong { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .design-badge .info-item span { font-size: 14px; font-weight: 600; color: #0f172a; }
        .design-badge .badge-photo {
            width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
            border: 4px solid #f8fafc; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .design-badge .badge-footer {
            margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid #f1f5f9; padding-top: 15px;
        }
        .design-badge .sign-area-badge { width: 60px; height: 40px; object-fit: contain; }


        /* Toast Notification */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
            text-align: center; border-radius: 8px; padding: 16px; position: fixed;
            z-index: 99; left: 50%; bottom: 30px; transform: translateX(-50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 14px;
            opacity: 0; transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        #toast.error { background-color: #ef4444; }
        #toast.success { background-color: #10b981; }
        /* Add left spacing for Classic Blue design */
.design-classic .body {
    padding-left: 26px;   /* adjust: 20–30px as you like */
    padding-right: 20px;  /* keeps balance */
}

.design-classic .footer {
    padding-left: 26px;   /* aligns footer with body */
}
.design-creative .footer {
    background: #8b5cf6;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: auto;
    margin-left: -20px;
    margin-right: -20px;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
}
/* Reduce gap between Guardian and Address (Creative design) */
.design-creative .info-grid > div:nth-last-child(2) {
    margin-bottom: -6px;
}

.design-creative #cardAddress {
    margin-top: 0px;
}



    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>ID Card Generator</h1>
        <p>Select a design, enter details and download as JPG</p>
    </header>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Left Panel: Controls -->
        <div class="panel">
            <div class="panel-title">
                1. Student Details
                <button id="fetchBtn" class="btn" style="width: auto; padding: 0.5rem 1rem; font-size: 0.8rem; margin: 0;">Fetch from Firestore</button>
            </div>

            <div class="form-group" style="background: #eff6ff; padding: 10px; border-radius: 8px; border: 1px solid #bfdbfe;">
                <label for="userId" style="color: #1e40af;">Firestore User ID</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="userId" placeholder="e.g. student_123">
                </div>
            </div>

            <form id="idForm">
                <div class="form-group">
                    <label for="schoolName">School Name</label>
                    <input type="text" id="schoolName" placeholder="Enter School Name">
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="studentName">Student Name</label>
                        <input type="text" id="studentName" placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <label for="fatherName">Parent/Guardian</label>
                        <input type="text" id="fatherName" placeholder="Parent Name">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                       <label for="classSelect">Class</label>
<input type="text" id="classSelect" placeholder="Enter Class (e.g. 8, UKG, KG1)">

                    </div>
                    <div class="form-group">
                        <label for="rollNo">Roll No</label>
                        <input type="text" id="rollNo" placeholder="Roll No">
                    </div>
                </div>

                <div class="row">
  <div class="form-group">
    <label for="sex">Sex</label>
<input type="text" id="sex" placeholder="Enter Gender (Male / Female / Other)">

  </div>

  <div class="form-group">
    <label for="mobileNo">Mobile No</label>
    <input type="text" id="mobileNo" placeholder="10-digit mobile number">
  </div>
</div>

<div class="form-group">
  <label for="academicYear">Academic Year</label>
  <select id="academicYear"></select>
</div>


                <!-- CHANGED TO TEXTAREA -->
                <div class="form-group">
                    <label for="address">Address (Press Enter for new line)</label>
                    <textarea id="address" placeholder="Street, City&#10;State, Zip"></textarea>
                </div>

                <!-- File Uploads -->
                <div class="row">
                    <div class="form-group">
                        <label>Student Photo</label>
                        <div class="file-upload-wrapper">
                            <label for="photoUpload" class="file-upload-label" id="photoLabel">Click to Upload Photo</label>
                            <input type="file" id="photoUpload" accept="image/*">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Signature</label>
                        <div class="file-upload-wrapper">
                            <label for="signUpload" class="file-upload-label" id="signLabel">Click to Upload Sign</label>
                            <input type="file" id="signUpload" accept="image/*">
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- Right Panel: Design & Preview -->
        <div class="panel">
            <div class="panel-title">2. Design & Preview</div>
            
            <label style="margin-bottom: 0.5rem;">Select Card Style</label>
            <div class="template-selector">
                <div class="template-option active" onclick="window.setTemplate('classic')">Classic Blue</div>
                <div class="template-option" onclick="window.setTemplate('creative')">Creative</div>
                <div class="template-option" onclick="window.setTemplate('badge')">Modern Badge</div>
            </div>

            <!-- Live Preview Area -->
            <div class="card-preview-container">
                <!-- ID CARD -->
                <div id="idCard" class="id-card design-classic">
                    <!-- Content injected via JS -->
                </div>
            </div>

            <button class="btn btn-secondary" onclick="downloadJpg()">Download as JPG</button>
        </div>

    </div>

    <!-- Toast -->
    <div id="toast">Message here</div>

    <!-- --- MAIN JAVASCRIPT --- -->
    <script type="module">
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        // --- 1. STATE VARIABLES ---
        let storedPhotoUrl = "https://picsum.photos/seed/student/200/200";
        let storedSignUrl = "https://picsum.photos/seed/sign/100/50";
        let currentTemplate = 'classic';

        // --- 2. Dropdowns ---
       
        const classSelect = document.getElementById('classSelect');
const yearSelect = document.getElementById('academicYear'); // keep year as dropdown if you want
// Populate Academic Year dropdown
// Populate Academic Year dropdown (2026–2040) and set default to current year
(function populateYears() {
  const startYear = 2026;
  const endYear = 2040;

  const now = new Date();
  const currentYear = now.getFullYear();

  // academic year logic (e.g., 2025-2026)
  const currentAcademicYear =
    now.getMonth() >= 5
      ? `${currentYear}-${currentYear + 1}`
      : `${currentYear - 1}-${currentYear}`;

  let defaultSet = false;

  for (let y = startYear; y <= endYear; y++) {
    const val = `${y}-${y + 1}`;
    const opt = document.createElement("option");
    opt.value = val;
    opt.textContent = val;

    // set default if matches current academic year
    if (val === currentAcademicYear) {
      opt.selected = true;
      defaultSet = true;
    }

    yearSelect.appendChild(opt);
  }

  // if current academic year not in range, select first option
  if (!defaultSet && yearSelect.options.length > 0) {
    yearSelect.selectedIndex = 0;
  }
})();


        // --- 3. Input Handling ---
        const inputs = {
            school: document.getElementById('schoolName'),
            name: document.getElementById('studentName'),
            father: document.getElementById('fatherName'),
            class: document.getElementById('classSelect'),
            roll: document.getElementById('rollNo'),
            sex: document.getElementById('sex'),
            mobile: document.getElementById('mobileNo'),

            year: document.getElementById('academicYear'),
            address: document.getElementById('address'), // Now refers to textarea
            photo: document.getElementById('photoUpload'),
            sign: document.getElementById('signUpload')
        };
// ===== School Name LocalStorage Save & Load =====

// Load saved school name on page load
const savedSchoolName = localStorage.getItem("schoolName");
if (savedSchoolName) {
    inputs.school.value = savedSchoolName;
}

// Save school name whenever user types
inputs.school.addEventListener("input", () => {
    localStorage.setItem("schoolName", inputs.school.value);
});

        function updateCard() {
            renderCardDesign();
        }

        Object.values(inputs).forEach(input => {
            if(input !== inputs.photo && input !== inputs.sign) {
                input.addEventListener('input', updateCard);
            }
        });

        function handleImageUpload(inputElement, labelId, isPhoto) {
            inputElement.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const result = evt.target.result;
                        if(isPhoto) storedPhotoUrl = result;
                        else storedSignUrl = result;
                        document.getElementById(labelId).textContent = file.name;
                        document.getElementById(labelId).style.borderColor = "var(--primary-color)";
                        renderCardDesign();
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        handleImageUpload(inputs.photo, 'photoLabel', true);
        handleImageUpload(inputs.sign, 'signLabel', false);

        // --- 4. RENDER LOGIC ---
        function renderCardDesign() {
            const card = document.getElementById('idCard');
            if(!card) return;

            const data = {
                school: inputs.school.value || "SCHOOL NAME",
                year: inputs.year.value || "2024-2025",
                name: inputs.name.value || "Student Name",
                father: inputs.father.value || "Father Name",
                class: inputs.class.value || "--",
                roll: inputs.roll.value || "--",
                sex: inputs.sex.value || "--",
                mobile: inputs.mobile.value || "--",
                address: inputs.address.value || "--",
                photo: storedPhotoUrl,
                sign: storedSignUrl
            };

            let html = '';

            if (currentTemplate === 'classic') {
                html = `
                    <div class="header">
                        <h2 id="cardSchool">${data.school}</h2>
                        <span id="cardYear" style="font-size: 10px; opacity: 0.8; text-transform: uppercase;">Academic Year: ${data.year}</span>
                    </div>
                    <div class="body">
                        <div class="photo-container">
                            <img src="${data.photo}" id="cardPhoto" class="student-photo" alt="Photo">
                        </div>
                        <h3 id="cardName" style="margin-top: 10px; font-size: 16px; color: #333;">${data.name}</h3>
                        <div class="info-row">
                            <div class="row">
                                <div><span class="label">Class</span><span id="cardClass">${data.class}</span></div>
                                <div><span class="label">Roll No</span><span id="cardRoll">${data.roll}</span></div>
                            </div>
                            <!-- Address now on a separate full-width row below Sex -->
                           <div class="row" style="margin-top: 10px;">
    <div>
        <span class="label">Sex</span>
        <span id="cardSex">${data.sex}</span>
    </div>
    <div>
        <span class="label">Mobile</span>
        <span id="cardMobile">${data.mobile}</span>
    </div>
</div>

                            <!-- white-space: pre-wrap preserves newlines from textarea -->
                            <div style="margin-top: 1px; text-align: left;"><span class="label">Address</span><span id="cardAddress" style="word-wrap: break-word; white-space: pre-wrap;">${data.address}</span></div>
                        </div>
                    </div>
                    <div class="footer">
                        <div>
                            <span class="label">Parent/Guardian</span>
                            <span id="cardFather" style="font-weight: 500; font-size: 11px;">${data.father}</span>
                        </div>
                        <div style="text-align: right;">
                            <span class="label">Signature</span>
                            <img src="${data.sign}" id="cardSign" class="sign-area" alt="Sign">
                        </div>
                    </div>
                `;
                card.className = 'id-card design-classic';
            } 
            else if (currentTemplate === 'creative') {
                html = `
                    <div class="bg-shape"></div>
                    <div class="content">
                        <div class="top">
                            <h2 id="cardSchool" style="color: #ec4899; font-size: 20px; font-weight: 800;">${data.school}</h2>
                            <p id="cardYear" style="color: #8b5cf6; font-weight: 600;">${data.year}</p>
                        </div>
                        <div class="main">
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <img src="${data.photo}" id="cardPhoto" class="student-photo" alt="Photo">
                                <div>
                                    <h2 id="cardName" style="color: #333; margin: 0; font-size: 18px;">${data.name}</h2>
                                    <p id="cardRoll" style="color: #666; margin: 0;">Roll: ${data.roll}</p>
                                </div>
                            </div>
                           <div class="info-grid">
    <div>
        <span class="label">Class</span>
        <p id="cardClass">${data.class}</p>
    </div>

    <div>
        <span class="label">Sex</span>
        <p id="cardSex">${data.sex}</p>
    </div>

    <div>
        <span class="label">Mobile</span>
        <p id="cardMobile">${data.mobile}</p>
    </div>

    <div>
    <span class="label">Roll</span>
    <p id="cardRoll">${data.roll}</p>
</div>


    <!-- Guardian + Signature SAME ROW -->
    <div>
        <span class="label">Guardian</span>
        <p id="cardFather">${data.father}</p>
    </div>

   <div style="text-align:right;">
    <img src="${data.sign}" id="cardSign"
         style="height:32px; object-fit:contain;" alt="Signature">

    <div style="font-size:9px; color:#777; margin-top:2px;">
        Authority Signature
    </div>
</div>


    <!-- Address full width -->
    <div style="grid-column: span 2;">
        <span class="label">Address</span>
        <p id="cardAddress"

</div>

                `;
                card.className = 'id-card design-creative';
            }
            else if (currentTemplate === 'badge') {
                html = `

                        </div>

                        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">

                                <div class="info-item">
    <strong>Mobile</strong> <span id="cardMobile">${data.mobile}</span>
</div>

                            </div>
                            <div class="info-item">
                                <strong>Address</strong> <span id="cardAddress" style="white-space: pre-wrap;">${data.address}</span>

        // --- 5. Template Switcher ---
        window.setTemplate = function(templateName) {
            currentTemplate = templateName;
            const options = document.querySelectorAll('.template-option');
            options.forEach(opt => opt.classList.remove('active'));
            
            options.forEach(opt => {
                if(opt.textContent.toLowerCase().includes(templateName === 'badge' ? 'badge' : templateName)) opt.classList.add('active');
            });
            
            renderCardDesign();
        }

        // --- 6. Firestore Fetch ---
        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const userId = document.getElementById('userId').value.trim();
            const toast = document.getElementById('toast');

            if (!userId) {
                showToast("Please enter a User ID", "error");
                return;
            }

            showToast("Fetching data...", "success");

            try {
                const db = window.db; 
                if (!db) throw new Error("Firestore not initialized");

                const docRef = doc(db, "students", userId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.name) inputs.name.value = data.name;
                    if(data.school) inputs.school.value = data.school;
                    if(data.fatherName) inputs.father.value = data.fatherName;
                    if(data.className) inputs.class.value = data.className;
                    if(data.rollNo) inputs.roll.value = data.rollNo;
                    if(data.sex) inputs.sex.value = data.gender;
                    if (data.mobileNo) inputs.mobile.value = data.mobileNo;
                    if(data.address) inputs.address.value = data.address;
                    if(data.academicYear) inputs.year.value = data.academicYear;
                    if (data.ownerId) {
  const userRef = doc(db, "users", data.ownerId);
  const userSnap = await getDoc(userRef);

  if (userSnap.exists()) {
    const userData = userSnap.data();
    if (userData.schoolName) {
      inputs.school.value = userData.schoolName;
    }
  }
}
                    if(data.photoUrl) {
                        storedPhotoUrl = data.photoUrl;
                        document.getElementById('photoLabel').textContent = "Loaded from DB";
                    }
                    if(data.signUrl) {
                        storedSignUrl = data.signUrl;
                        document.getElementById('signLabel').textContent = "Loaded from DB";
                    }

                    renderCardDesign();
                    showToast("Data loaded successfully!", "success");
                } else {
                    showToast("No document found for this ID", "error");
                }
            } catch (error) {
                console.error("Error fetching document:", error);
                showToast("Error: " + error.message, "error");
            }
        });

        // --- 7. Utility ---
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = type === 'error' ? 'error show' : 'success show';
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }
        // --- AUTO FILL FROM URL (FORWARDED STUDENT DATA) ---
const urlParams = new URLSearchParams(window.location.search);
const forwardedId = urlParams.get("id");

const pName = urlParams.get("name");
const pClass = urlParams.get("class");
const pRoll = urlParams.get("roll");
const pFather = urlParams.get("father");
const pMobile = urlParams.get("mobile");
const pSex = urlParams.get("sex");
const pAddress = urlParams.get("address");

if (pSex) document.getElementById("sex").value = pSex;
if (pAddress) document.getElementById("address").value = pAddress;


if (pName) document.getElementById("studentName").value = pName;
if (pClass) document.getElementById("classSelect").value = pClass;
if (pRoll) document.getElementById("rollNo").value = pRoll;
if (pFather) document.getElementById("fatherName").value = pFather;
if (pMobile) document.getElementById("mobileNo").value = pMobile;

// refresh preview
if (typeof renderCardDesign === "function") {
  renderCardDesign();
}


if (forwardedId) {
  const userIdInput = document.getElementById("userId");
  if (userIdInput) userIdInput.value = forwardedId;
}



// refresh preview
if (typeof renderCardDesign === "function") {
  renderCardDesign();
}


        // Initial Render
        renderCardDesign();
    </script>

    <!-- JPG Download Function -->
    <script>
        function downloadJpg() {
            const card = document.getElementById("idCard");
            const btn = document.querySelector('.btn-secondary');
            const originalText = btn.textContent;
            
            btn.textContent = "Generating...";
            btn.disabled = true;

            html2canvas(card, {
                scale: 2, 
                backgroundColor: null 
            }).then(canvas => {
                const imgData = canvas.toDataURL("image/jpeg", 1.0);
                const link = document.createElement('a');
                link.href = imgData;
                link.download = 'student-id-card.jpg';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                btn.textContent = originalText;
                btn.disabled = false;
            }).catch(err => {
                console.error(err);
                alert("Error generating image. Please try again.");
                btn.textContent = originalText;
                btn.disabled = false;
            });
        }
    </script>
