<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Print Marksheet</title>

<style>

body{
font-family:Arial,sans-serif;
background:#ffffff;
margin:0;
padding:1px;
}

.actions{
margin-bottom:1px;
display:flex;
gap:1px;
}

.btn{
padding:10px 20px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
color:white;
}

.print-btn{
background:#1976d2;
}

.download-btn{
background:#28a745;
}

.marksheet{
max-width:980px;
margin:auto;
background:white;
padding:10px;
border:3px solid #000;
box-shadow:0 2px 8px rgba(0,0,0,.15);
box-sizing:border-box;
}

.school-header{
text-align:center;
margin-bottom:2
px;
}

.school-logo{
width:60px;
height:60px;
object-fit:contain;
}

.school-name{
font-size:26px;
font-weight:bold;
}

.school-address{
font-size:10px;
}
.marksheet-title{
font-size:20px;
font-weight:bold;
text-align:center;
margin-top:5px;
margin-bottom:5px;
letter-spacing:2px;
}

.grade-box{
border:2px solid #000;
width:120px;
padding:1px;
text-align:center;
font-weight:bold;
}

.percentage-box{
border:2px solid #000;
padding:1px;
width:220px;
text-align:center;
font-weight:bold;
}

.result-section{
display:flex;
justify-content:center;
gap:60px;
align-items:center;
margin-top:1px;
margin-bottom:1px;
}
.signature-section{
margin-top:2px;
display:flex;
justify-content:space-between;
page-break-inside:avoid;
break-inside:avoid;
}

.signature{
text-align:center;
width:220px;
}

.signature img{
height:60px;
margin-top:25px;
margin-bottom:1px;
max-width:200px;
}

.student-info{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin:2px 0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:1px;
}

th,td{
border:1px solid #000;
border-collapse:collapse;
padding:5px;
text-align:center;
}

.summary{
margin-top:20px;
font-size:18px;
font-weight:bold;
line-height:35px;
}

@media print{

.actions{
display:none;
}

body{
background:white;
padding:20px;
}

.marksheet{
box-shadow:none;
border:3px;
}

}
.semester-summary{
margin-top:2px;
margin-bottom:2px;
}

.semester-summary h3{
text-align:center;
margin-bottom:1px;
}

#semesterSummaryTable{
width:90%;
border-collapse:collapse;
}

#semesterSummaryTable th,
#semesterSummaryTable td{
border:1px solid #000;
padding:1px;
text-align:center;
}

</style>
</head>

<body>

<div class="actions">

<button
class="btn print-btn"
onclick="window.print()">
Print
</button>

<button
class="btn download-btn"
onclick="downloadPDF()">
Download PDF
</button>

</div>

<div class="marksheet">

<div class="school-header">

<img
id="schoolLogo"
class="school-logo"
src="">

<div
id="schoolName"
class="school-name">
Loading...
</div>

<div
id="schoolAddress"
class="school-address">
</div>

<div class="marksheet-title">
MARK SHEET
</div>

</div>

<hr>

<div class="student-info">

<div>
<b>Name:</b>
<span id="studentName"></span>
</div>

<div>
<b>Roll:</b>
<span id="studentRoll"></span>
</div>

<div>
<b>Class:</b>
<span id="studentClass"></span>
</div>

<div>
<b>Semester:</b>
<span id="studentSemester"></span>
</div>

<div>
<b>Session:</b>
<span id="studentSession"></span>
</div>

</div>

<table>

<thead>

<tr>

<th rowspan="2">
Subject
</th>

<th colspan="3">
Total Marks
</th>

<th colspan="3">
Marks Obtained
</th>

</tr>

<tr>

<th>Written</th>
<th>Oral</th>
<th>Total</th>

<th>Written</th>
<th>Oral</th>
<th>Total</th>

</tr>

</thead>

<tbody id="subjectTable">
</tbody>

</table>

<div class="result-section">

<div class="percentage-box">

<div>
Obtain Marks
</div>

<div id="totalMarks">
0
</div>

<br>

<div>
Percentage
</div>

<div>
<span id="percentage">0</span>%
</div>

</div>
<div class="semester-summary">

<h3>Semester Summary</h3>

<table id="semesterSummaryTable">

<thead>
<tr>
<th>Semester</th>
<th>Total Marks</th>
<th>Marks Obtained</th>
<th>Percentage</th>
<th>Grade</th>
</tr>
</thead>

<tbody>

</tbody>

</table>

</div>

<div class="grade-box">

<div>
GRADE
</div>

<div
id="grade"
style="

margin-top:1px;
font-size:70px;
font-weight:900;
">
-
</div>


</div>



</div>
<div class="signature-section">

<div class="signature">

<img
id="principalSignature"
src="">

<div style="
width:250px;
border-top:2px solid #000;
margin:6px auto;
"></div>

<div>
PRINCIPAL SIGNATURE
</div>

</div>

<div class="signature">

<div style="
width:230px;
border-top:2px solid #000;
margin:100px  auto 10px ;
"></div>

<div>
CLASS TEACHER SIGNATURE
</div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>



<script>

function downloadPDF(){

const element =
document.querySelector(".marksheet");

html2pdf()
.set({
    

margin:[5,5,5,5],
pagebreak:{
mode:['avoid-all']
},

filename:"marksheet.pdf",

html2canvas:{
scale:2,
backgroundColor:"#ffffff"
},

jsPDF:{
unit:"mm",
format:"a4",
orientation:"portrait"
}

})
.from(element)
.save();

}

</script>
<script src="print-marksheet.js"></script>

</body>
</html>
