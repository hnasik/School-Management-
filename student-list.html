<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student List</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
margin:0;
}

.header{
font-size:22px;
font-weight:bold;
text-align:center;
margin-bottom:15px;
}

.logout-btn{
width:100%;
padding:10px;
background:red;
border:none;
color:white;
border-radius:8px;
margin-bottom:10px;
}

.search{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:15px;
}

.class-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:15px;
}

.class-btn{
padding:10px;
background:#1976d2;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
transition: 0.2s;
}

.class-btn:hover {
background:#1565c0;
}

/* Active state for class buttons */
.class-btn.active{
background:#0d47a1;
box-shadow: inset 0 3px 5px rgba(0,0,0,0.3);
transform: scale(0.98);
}

/* Section Filter Styles */
.section-grid{
display:flex;
gap:8px;
margin-bottom:20px;
flex-wrap:wrap;
}

.section-btn{
padding:8px 16px;
background:#e0e0e0;
color:#333;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
font-size:14px;
transition: 0.2s;
}

.section-btn:hover{
background:#d5d5d5;
}

/* Active state for section buttons */
.section-btn.active{
background:#ff9800;
color:white;
box-shadow: 0 2px 5px rgba(255,152,0,0.4);
}

.student-row{
background:white;
padding:12px;
margin-bottom:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

/* Container for the two buttons */
.action-btns {
    display: flex;
    gap: 8px;
    align-items: center;
}

.add-btn{
background:#28a745;
color:white;
border:none;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
transition: 0.2s;
}

.add-btn:hover {
background:#218838;
}

.delete-btn{
background:#dc3545;
color:white;
border:none;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
transition: 0.2s;
}

.delete-btn:hover {
background:#c82333;
}

.loading{
text-align:center;
padding:20px;
}
.sidebar{
position:fixed;
left:0;
top:0;
width:220px;
height:100%;
background:#1976d2;
padding-top:20px;
box-sizing:border-box;
overflow-y: auto;
}

.sidebar h3{
color:white;
text-align:center;
margin-bottom:20px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px 20px;
font-weight:bold;
}

.sidebar a:hover{
background:rgba(255,255,255,.2);
}

.main-content{
margin-left:235px;
padding:15px;
}

/* =========================================
   MOBILE RESPONSIVENESS (Media Queries)
   ========================================= */
@media (max-width: 768px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 15px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
    }

    .sidebar h3 {
        width: 100%;
        margin-bottom: 5px;
        margin-top: 0;
    }

    .sidebar a {
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        font-size: 14px;
    }

    .main-content {
        margin-left: 0;
        padding: 10px;
    }

    .class-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
    }

    .class-btn {
        padding: 8px 5px;
        font-size: 14px;
    }

    .student-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }

    .action-btns {
        width: 100%;
    }

    .action-btns button {
        flex: 1; /* Makes buttons stretch equally on mobile */
    }
}

@media (max-width: 480px) {
    .class-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>
<body>
    <div class="sidebar">

<h3>Marksheet Menu</h3>

<a href="student-list.html">
Student List
</a>

<a href="marksheet-preview.html">
Marksheet Preview
</a>
<a href="marksheet.html">
Marksheet
</a>

<a href="add-marksheet.html">
Add Marksheet
</a>

</div>

<div class="main-content">

<div class="header">Student List</div>

<button class="logout-btn" onclick="logout()">
Logout
</button>

<input
type="text"
id="searchInput"
class="search"
placeholder="Search Student">

<div class="class-grid">
<button class="class-btn" onclick="filterClass('PREPRIMARY', this)">PREPRIMARY</button>
<button class="class-btn" onclick="filterClass('Nursery', this)">Nursery</button>
<button class="class-btn" onclick="filterClass('LKG', this)">LKG</button>
<button class="class-btn" onclick="filterClass('UKG', this)">UKG</button>

<button class="class-btn" onclick="filterClass('1', this)">1</button>
<button class="class-btn" onclick="filterClass('2', this)">2</button>
<button class="class-btn" onclick="filterClass('3', this)">3</button>
<button class="class-btn" onclick="filterClass('4', this)">4</button>

<button class="class-btn" onclick="filterClass('5', this)">5</button>
<button class="class-btn" onclick="filterClass('6', this)">6</button>
<button class="class-btn" onclick="filterClass('7', this)">7</button>
<button class="class-btn" onclick="filterClass('8', this)">8</button>

<button class="class-btn" onclick="filterClass('9', this)">9</button>
<button class="class-btn" onclick="filterClass('10', this)">10</button>
<button class="class-btn" onclick="filterClass('11', this)">11</button>
<button class="class-btn" onclick="filterClass('12', this)">12</button>
</div>

<!-- Section Filter Buttons -->
<div class="section-grid">
    <button class="section-btn active" onclick="filterSection('ALL', this)">All Sections</button>
    <button class="section-btn" onclick="filterSection('A', this)">Section A</button>
    <button class="section-btn" onclick="filterSection('B', this)">Section B</button>
    <button class="section-btn" onclick="filterSection('C', this)">Section C</button>
    <button class="section-btn" onclick="filterSection('D', this)">Section D</button>
</div>

<div id="studentContainer">
<div class="loading">Loading Students...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="student-list.js"></script>
</div>
</body>
</html>
